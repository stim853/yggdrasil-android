name: Build APK  on:   push:     branches: [main]   workflow_dispatch:  env:   ANDROID_SDK_ROOT: /opt/android-sdk  jobs:   build:     runs-on: ubuntu-22.04     steps:       - uses: actions/checkout@v4        - name: Set up Java 17         uses: actions/setup-java@v4         with:           distribution: zulu           java-version: 17        - name: Set up Go 1.23         uses: actions/setup-go@v5         with:           go-version: '1.23'        - name: Setup Android SDK         uses: android-actions/setup-android@v4        - name: Install extra SDK components         run: |           yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"           sdkmanager "ndk;27.2.12479018" || true           echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV        - name: Setup gomobile         run: |           export PATH=$HOME/go/bin:$PATH           go install golang.org/x/mobile/cmd/gomobile@latest           go install golang.org/x/mobile/cmd/gobind@latest           gomobile init        - name: Clone yggdrasil-go and add AmneziaWG         run: |           cd /tmp           git clone --depth=1 --branch v0.5.14 https://github.com/yggdrasil-network/yggdrasil-go.git           mkdir -p yggdrasil-go/contrib/awgmobile           cp $GITHUB_WORKSPACE/contrib/awgmobile/awgmobile.go yggdrasil-go/contrib/awgmobile/           cd yggdrasil-go           go get golang.org/x/mobile/bind           go get golang.zx2c4.com/wireguard@latest           go mod tidy           echo "YGG_DIR=/tmp/yggdrasil-go" >> $GITHUB_ENV        - name: Build AAR (Yggdrasil + AmneziaWG)         run: |           export PATH=$HOME/go/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH           mkdir -p $GITHUB_WORKSPACE/app/libs           cd $YGG_DIR           go get -tool golang.org/x/mobile/cmd/gobind 2>/dev/null || true           go mod tidy           gomobile bind \             -target android \             -androidapi 26 \             -tags mobile \             -o $GITHUB_WORKSPACE/app/libs/holowbark.aar \             -ldflags="-s -w -checklinkname=0" \             ./contrib/mobile \             ./src/config \             ./contrib/awgmobile        - name: Build APK         run: |           export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH           chmod +x gradlew           ./gradlew assembleDebug        - uses: actions/upload-artifact@v4         with:           name: holowbark-apk           path: app/build/outputs/apk/debug/*.apk