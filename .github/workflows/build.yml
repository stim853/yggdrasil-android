name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup gomobile
        run: |
          export PATH=$HOME/go/bin:$PATH
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Clone yggdrasil-go and add AmneziaWG
        run: |
          cd /tmp
          git clone --depth=1 https://github.com/yggdrasil-network/yggdrasil-go.git
          mkdir -p yggdrasil-go/contrib/awgmobile
          cp $GITHUB_WORKSPACE/contrib/awgmobile/awgmobile.go yggdrasil-go/contrib/awgmobile/
          cd yggdrasil-go
          go get golang.org/x/mobile/bind
          go get github.com/amnezia-vpn/amneziawg-go@latest
          go mod tidy
          echo "YGG_DIR=/tmp/yggdrasil-go" >> $GITHUB_ENV

      - name: Build AAR (Yggdrasil + AmneziaWG)
        run: |
          export PATH=$HOME/go/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          cd $YGG_DIR
          gomobile bind \
            -target android \
            -androidapi 26 \
            -tags mobile \
            -o $GITHUB_WORKSPACE/app/libs/holowbark.aar \
            -ldflags="-s -w -checklinkname=0" \
            ./contrib/mobile \
            ./src/config \
            ./contrib/awgmobile

      - name: Build APK
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: holowbark-apk
          path: app/build/outputs/apk/debug/*.apk
